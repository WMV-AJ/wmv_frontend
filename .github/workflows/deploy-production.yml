name: Deploy Frontend to Production (Port 2310)

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 91.99.102.124
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e

            cd /opt/wmv-frontend

            # Pull latest production branch
            sudo git pull origin production

            # Install dependencies
            sudo npm install

            # Build Next.js
            sudo npm run build

            # Restart with PM2
            sudo pm2 restart wmv-frontend || sudo PORT=2310 pm2 start /opt/wmv-frontend/.next/standalone/server.js --name wmv-frontend

            echo "Production frontend deploy complete — $(date)"
